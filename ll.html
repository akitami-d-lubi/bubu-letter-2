<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,
               initial-scale=1.0,
               maximum-scale=1.0,
               viewport-fit=cover">

<meta name="theme-color" content="#f7c6d4">

<title>For You ♡</title>

<style>

/* =========================================================
   RESET
========================================================= */

* {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

html,
body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
}

body {
    background: #1b0c13;
    font-family: Georgia, "Times New Roman", serif;
}


/* =========================================================
   APP
========================================================= */

#app {
    position: relative;

    width: 100%;
    height: 100dvh;
    min-height: 100dvh;

    overflow: hidden;

    background:
        radial-gradient(
            circle at 50% 18%,
            rgba(255,255,255,.75),
            transparent 31%
        ),
        radial-gradient(
            circle at 15% 80%,
            rgba(255,191,210,.5),
            transparent 35%
        ),
        radial-gradient(
            circle at 90% 70%,
            rgba(255,218,229,.4),
            transparent 35%
        ),
        linear-gradient(
            155deg,
            #fff2f6 0%,
            #f6c2d2 46%,
            #d57e99 100%
        );
}


/* =========================================================
   VIGNETTE
========================================================= */

#app::after {
    content: "";

    position: absolute;
    inset: 0;

    pointer-events: none;

    background:
        radial-gradient(
            ellipse at center,
            transparent 35%,
            rgba(76,22,42,.22) 100%
        );

    z-index: 200;
}


/* =========================================================
   BACKGROUND GLOW
========================================================= */

.glow {
    position: absolute;

    width: 250px;
    height: 250px;

    border-radius: 50%;

    background:
        rgba(255,255,255,.32);

    filter: blur(70px);

    pointer-events: none;
}


/* =========================================================
   PARTICLES
========================================================= */

.particles {
    position: absolute;
    inset: 0;

    overflow: hidden;

    pointer-events: none;

    z-index: 2;
}

.particle {
    position: absolute;

    width: 4px;
    height: 4px;

    border-radius: 50%;

    background: white;

    animation:
        particleFloat
        linear
        infinite;
}

@keyframes particleFloat {

    0% {
        transform:
            translateY(110vh)
            scale(.4);

        opacity: 0;
    }

    15% {
        opacity: .7;
    }

    100% {
        transform:
            translateY(-10vh)
            translateX(30px)
            scale(1.2);

        opacity: 0;
    }
}


/* =========================================================
   FLOATING HEARTS
========================================================= */

.floating-heart {
    position: absolute;

    color: rgba(255,255,255,.75);

    pointer-events: none;

    animation:
        floatingHeart
        linear
        infinite;
}

@keyframes floatingHeart {

    0% {
        transform:
            translateY(110vh)
            rotate(0deg);

        opacity: 0;
    }

    15% {
        opacity: .75;
    }

    100% {
        transform:
            translateY(-15vh)
            rotate(25deg);

        opacity: 0;
    }
}


/* =========================================================
   INTRO
========================================================= */

#intro {
    position: absolute;
    inset: 0;

    z-index: 50;

    display: flex;

    flex-direction: column;

    align-items: center;
    justify-content: center;

    text-align: center;

    padding:
        calc(env(safe-area-inset-top) + 20px)
        24px
        calc(env(safe-area-inset-bottom) + 20px);

    transition:
        opacity 1.15s ease,
        transform 1.15s
        cubic-bezier(.22,.61,.36,1);
}

#intro.hide {
    opacity: 0;

    transform:
        scale(1.07);

    pointer-events: none;
}


/* =========================================================
   INTRO HEART
========================================================= */

.intro-heart {
    width: 76px;
    height: 76px;

    display: flex;

    align-items: center;
    justify-content: center;

    border-radius: 50%;

    color: white;

    font-size: 44px;

    background:
        rgba(255,255,255,.18);

    border:
        1px solid rgba(255,255,255,.6);

    box-shadow:
        0 0 28px rgba(255,255,255,.7),
        inset 0 0 20px rgba(255,255,255,.2);

    backdrop-filter: blur(10px);

    animation:
        introPulse
        2.3s
        ease-in-out
        infinite;
}

@keyframes introPulse {

    0%,
    100% {
        transform: scale(1);
    }

    50% {
        transform: scale(1.1);
    }
}


/* =========================================================
   INTRO TEXT
========================================================= */

.intro-title {
    margin-top: 28px;

    color: #71394d;

    font-size:
        clamp(26px, 7vw, 38px);

    font-weight: 400;
}

.intro-subtitle {
    margin-top: 8px;

    color: #99536d;

    font-family:
        "Segoe Script",
        "Brush Script MT",
        cursive;

    font-size: 18px;
}


/* =========================================================
   BUTTON
========================================================= */

.open-button {
    margin-top: 34px;

    padding:
        15px 28px;

    border-radius: 999px;

    border:
        1px solid rgba(255,255,255,.75);

    background:
        linear-gradient(
            135deg,
            rgba(255,255,255,.8),
            rgba(255,220,230,.65)
        );

    color: #71394d;

    font-family: Georgia, serif;

    font-size: 16px;

    box-shadow:
        0 10px 30px rgba(100,40,60,.18),
        0 0 25px rgba(255,255,255,.5);

    backdrop-filter: blur(12px);

    cursor: pointer;
}

.open-button:active {
    transform: scale(.94);
}


/* =========================================================
   MAIN SCENE
========================================================= */

#scene {
    position: absolute;
    inset: 0;

    z-index: 10;

    display: flex;

    align-items: center;
    justify-content: center;

    perspective: 1600px;

    opacity: 0;

    transition:
        opacity 1.1s ease;

    pointer-events: none;
}

#scene.visible {
    opacity: 1;

    pointer-events: auto;
}


/* =========================================================
   ENVELOPE CONTAINER
========================================================= */

.envelope-container {
    position: relative;

    width:
        min(330px, 82vw);

    height: 220px;

    transform-style: preserve-3d;

    transform:
        translateY(15px)
        scale(.92);

    transition:
        transform 1.1s
        cubic-bezier(.17,.84,.44,1);

    z-index: 20;
}

#scene.visible
.envelope-container {
    transform:
        translateY(0)
        scale(1);
}


/* =========================================================
   ENVELOPE BODY
========================================================= */

.envelope {
    position: absolute;
    inset: 0;

    width: 100%;
    height: 100%;

    border-radius: 7px;

    background:
        linear-gradient(
            145deg,
            #fff5f7,
            #f0b1c2
        );

    box-shadow:
        0 30px 65px rgba(70,24,43,.28),
        inset 0 0 20px rgba(255,255,255,.45);

    transform-style: preserve-3d;

    overflow: visible;

    isolation: isolate;
}


/* =========================================================
   LETTER / PAPER
========================================================= */

/*
   The paper has THREE states:

   1. hidden inside envelope
   2. physically rising vertically
   3. unfolding toward viewer

   This avoids the old "teleporting paper" effect.
*/

.letter {
    position: absolute;

    left: 50%;

    bottom: 9px;

    width: 88%;
    height: 90%;

    transform-origin:
        center bottom;

    transform-style: preserve-3d;

    /*
       Starting position:
       mostly hidden INSIDE envelope.
    */
    transform:
        translateX(-50%)
        translateY(15px)
        rotateX(0deg)
        scale(.94);

    background:
        linear-gradient(
            135deg,
            #fffefa 0%,
            #fffaf0 100%
        );

    border-radius: 4px;

    padding:
        24px 19px;

    box-shadow:
        0 8px 20px rgba(70,28,45,.18);

    opacity: 1;

    /*
       IMPORTANT:
       It starts behind the envelope front.
    */
    z-index: 3;

    overflow: hidden;

    transition:
        transform 900ms
        cubic-bezier(.2,.85,.25,1),
        box-shadow 700ms ease;
}


/* =========================================================
   STAGE 1 — PAPER RISES
========================================================= */

/*
   The paper physically travels upward first.
*/

.envelope-container.paper-rising
.letter {

    transform:
        translateX(-50%)
        translateY(-105px)
        rotateX(0deg)
        scale(.94);

    /*
       Only after it clears the front
       does it become visually above it.
    */
    z-index: 12;

    box-shadow:
        0 18px 30px rgba(70,28,45,.18);
}


/* =========================================================
   STAGE 2 — PAPER UNFOLDS
========================================================= */

/*
   Now the top of the paper opens toward
   the viewer instead of spinning sideways.
*/

.envelope-container.paper-unfold
.letter {

    transform:
        translateX(-50%)
        translateY(-108px)
        rotateX(0deg)
        scale(1);

    box-shadow:
        0 24px 45px rgba(70,28,45,.22);
}


/* =========================================================
   STAGE 3 — PAPER SETTLES
========================================================= */

.envelope-container.paper-settle
.letter {

    transform:
        translateX(-50%)
        translateY(-112px)
        rotateX(0deg)
        scale(1);

    box-shadow:
        0 22px 45px rgba(70,28,45,.2);
}


/* =========================================================
   PAPER SHADOW
========================================================= */

.letter::after {
    content: "";

    position: absolute;

    inset: 0;

    pointer-events: none;

    background:
        linear-gradient(
            105deg,
            rgba(255,255,255,.45),
            transparent 35%,
            transparent 70%,
            rgba(150,90,110,.06)
        );
}


/* =========================================================
   ENVELOPE FRONT
========================================================= */

.envelope-front {
    position: absolute;
    inset: 0;

    background:
        linear-gradient(
            145deg,
            #f8c7d3,
            #e89caf
        );

    clip-path:
        polygon(
            0 0,
            50% 58%,
            100% 0,
            100% 100%,
            0 100%
        );

    z-index: 6;

    pointer-events: none;
}


/* =========================================================
   ENVELOPE FLAP
========================================================= */

.flap {
    position: absolute;

    left: 0;
    top: 0;

    width: 100%;
    height: 60%;

    background:
        linear-gradient(
            150deg,
            #ffe9ef,
            #edaabc
        );

    clip-path:
        polygon(
            0 0,
            50% 100%,
            100% 0
        );

    transform-origin:
        50% 0%;

    transform:
        rotateX(0deg);

    transition:
        transform 1.05s
        cubic-bezier(.65,.05,.36,1);

    z-index: 8;

    pointer-events: none;

    backface-visibility: visible;
}


/* =========================================================
   FLAP OPENS
========================================================= */

.envelope-container.flap-open
.flap {

    transform:
        rotateX(-178deg);
}


/* =========================================================
   ❤️ HEART SEAL
========================================================= */

.seal {

    position: absolute;

    left: 50%;
    top: 50%;

    width: 50px;
    height: 50px;

    margin: 0;
    padding: 0;

    display: flex;

    align-items: center;
    justify-content: center;

    transform:
        translate(-50%, -50%);

    border:
        1px solid rgba(255,255,255,.35);

    border-radius: 50%;

    background:
        radial-gradient(
            circle at 32% 28%,
            #ffc0d0,
            #e26a89 55%,
            #c94b6b 100%
        );

    color: white;

    font-size: 25px;

    line-height: 1;

    box-shadow:
        0 5px 16px rgba(110,35,58,.3),
        0 0 23px rgba(255,150,180,.7);

    z-index: 30;

    cursor: pointer;

    touch-action: manipulation;

    animation:
        sealGlow
        1.8s
        ease-in-out
        infinite;

    transition:
        opacity .4s ease,
        transform .55s
        cubic-bezier(.17,.84,.44,1);
}

@keyframes sealGlow {

    0%,
    100% {
        box-shadow:
            0 5px 16px rgba(110,35,58,.3),
            0 0 18px rgba(255,150,180,.55);
    }

    50% {
        box-shadow:
            0 5px 18px rgba(110,35,58,.32),
            0 0 34px rgba(255,150,180,.9);
    }
}

.envelope-container.flap-open
.seal {

    opacity: 0;

    transform:
        translate(-50%, -50%)
        scale(1.65);

    pointer-events: none;
}


/* =========================================================
   LETTER CONTENT
========================================================= */

.letter-inner {

    position: relative;

    width: 100%;
    height: 100%;

    display: flex;

    flex-direction: column;

    z-index: 2;
}

.letter-header {

    flex-shrink: 0;

    margin-bottom: 10px;

    text-align: center;

    color: #c65372;

    font-family:
        "Segoe Script",
        "Brush Script MT",
        cursive;

    font-size: 23px;
}

#letterText {

    flex: 1;

    overflow-y: auto;

    scrollbar-width: none;

    white-space: pre-line;

    color: #624351;

    font-family:
        "Segoe Print",
        "Bradley Hand",
        cursive;

    font-size:
        clamp(13px, 3.5vw, 16px);

    line-height: 1.62;
}

#letterText::-webkit-scrollbar {
    display: none;
}


/* =========================================================
   TULIPS
========================================================= */

.tulips {
    position: absolute;

    left: 0;
    bottom: -8px;

    width: 100%;
    height: 210px;

    z-index: 60;

    pointer-events: none;
}

.tulip {
    position: absolute;

    bottom: 0;

    width: 45px;
    height: 175px;

    opacity: 0;

    transform:
        translateY(65px)
        scale(.8);

    transform-origin:
        bottom center;

    transition:
        opacity 1s ease,
        transform 1.1s
        cubic-bezier(.17,.84,.44,1);

    animation:
        tulipSway
        4s
        ease-in-out
        infinite;

    pointer-events: auto;
}

.tulip.show {

    opacity: 1;

    transform:
        translateY(0)
        scale(1);
}

.tulip:nth-child(1) {
    left: 0;
    animation-delay: -.5s;
}

.tulip:nth-child(2) {
    left: 12%;
    animation-delay: -1.5s;
}

.tulip:nth-child(3) {
    right: 12%;
    animation-delay: -2s;
}

.tulip:nth-child(4) {
    right: 0;
    animation-delay: -1s;
}

.tulip:nth-child(5) {
    left: 43%;
    animation-delay: -2.5s;
}

@keyframes tulipSway {

    0%,
    100% {
        rotate: -2deg;
    }

    50% {
        rotate: 3deg;
    }
}


/* =========================================================
   TULIP STEM
========================================================= */

.stem {

    position: absolute;

    left: 50%;
    bottom: 0;

    width: 5px;
    height: 130px;

    transform:
        translateX(-50%);

    border-radius: 5px;

    background:
        linear-gradient(
            90deg,
            #4e7656,
            #7da77d
        );
}


/* =========================================================
   LEAVES
========================================================= */

.leaf {

    position: absolute;

    width: 42px;
    height: 17px;

    bottom: 55px;

    border-radius:
        100% 0 100% 0;

    background:
        #66966d;
}

.leaf.left {

    right: 50%;

    transform:
        rotate(-35deg);
}

.leaf.right {

    left: 50%;
    bottom: 76px;

    transform:
        rotate(30deg)
        scaleX(-1);
}


/* =========================================================
   FLOWER
========================================================= */

.flower {

    position: absolute;

    left: 50%;
    top: 17px;

    width: 56px;
    height: 52px;

    transform:
        translateX(-50%);

    filter:
        drop-shadow(
            0 5px 8px
            rgba(90,30,50,.18)
        );
}

.petal {

    position: absolute;

    width: 35px;
    height: 46px;

    border-radius:
        50% 50% 45% 45%;

    background:
        linear-gradient(
            160deg,
            #ffcad9,
            #e86f91
        );
}

.petal:nth-child(1) {
    left: 0;
    transform: rotate(-25deg);
}

.petal:nth-child(2) {
    left: 11px;
    top: -6px;
}

.petal:nth-child(3) {
    right: 0;
    transform: rotate(25deg);
}

.tulip.white .petal {
    background:
        linear-gradient(
            160deg,
            #fff,
            #f0dfe4
        );
}

.tulip.red .petal {
    background:
        linear-gradient(
            160deg,
            #eb7891,
            #bd3b5d
        );
}


/* =========================================================
   HELLO KITTY INSPIRED DECOR
========================================================= */

.kitty {

    position: absolute;

    width: 58px;
    height: 48px;

    border-radius:
        45% 45% 42% 42%;

    background: white;

    box-shadow:
        0 8px 20px rgba(94,36,55,.14);

    opacity: 0;

    transform:
        translateY(20px)
        scale(.7);

    transition:
        opacity 1s ease,
        transform 1s
        cubic-bezier(.17,.84,.44,1);

    z-index: 65;

    cursor: pointer;
}

.kitty.show {

    opacity: 1;

    transform:
        translateY(0)
        scale(1);

    animation:
        kittyFloat
        4s
        ease-in-out
        infinite;
}

.kitty::before,
.kitty::after {

    content: "";

    position: absolute;

    top: -11px;

    width: 22px;
    height: 22px;

    background: white;

    clip-path:
        polygon(
            0 100%,
            15% 0,
            100% 85%
        );
}

.kitty::before {
    left: 5px;
}

.kitty::after {
    right: 5px;

    transform:
        scaleX(-1);
}

.kitty-eye {

    position: absolute;

    top: 22px;

    width: 5px;
    height: 7px;

    border-radius: 50%;

    background: #333;
}

.kitty-eye.left {
    left: 16px;
}

.kitty-eye.right {
    right: 16px;
}

.kitty-nose {

    position: absolute;

    left: 50%;
    top: 29px;

    width: 7px;
    height: 5px;

    transform:
        translateX(-50%);

    border-radius: 50%;

    background: #e7b23f;
}

.kitty-bow {

    position: absolute;

    top: -5px;
    right: 2px;

    width: 24px;
    height: 16px;

    border-radius: 50%;

    background: #e55d82;

    transform:
        rotate(15deg);
}

.kitty-bow::after {

    content: "";

    position: absolute;

    left: 8px;
    top: 4px;

    width: 7px;
    height: 7px;

    border-radius: 50%;

    background: #ffd1dc;
}

.kitty.one {
    left: 4%;
    top: 19%;
}

.kitty.two {
    right: 4%;
    top: 27%;
}

.kitty.three {
    right: 7%;
    bottom: 24%;
}

@keyframes kittyFloat {

    0%,
    100% {
        translate: 0 0;
        rotate: -2deg;
    }

    50% {
        translate: 0 -8px;
        rotate: 2deg;
    }
}


/* =========================================================
   FALLING PETALS
========================================================= */

.petal-fall {

    position: absolute;

    top: -20px;

    width: 10px;
    height: 16px;

    border-radius:
        100% 0 100% 0;

    background:
        linear-gradient(
            135deg,
            #ffbdd0,
            #e97898
        );

    opacity: .8;

    pointer-events: none;

    z-index: 58;

    animation:
        fallPetal
        linear
        infinite;
}

@keyframes fallPetal {

    from {
        transform:
            translateY(-20px)
            rotate(0deg);
    }

    to {
        transform:
            translateY(110vh)
            translateX(80px)
            rotate(360deg);
    }
}


/* =========================================================
   FINAL MESSAGE
========================================================= */

#finalMessage {

    position: absolute;

    left: 50%;

    bottom:
        calc(
            env(safe-area-inset-bottom)
            + 24px
        );

    width: 90%;

    transform:
        translate(-50%, 25px);

    text-align: center;

    color: white;

    opacity: 0;

    z-index: 80;

    pointer-events: none;

    transition:
        opacity 1.2s ease,
        transform 1.2s
        cubic-bezier(.17,.84,.44,1);
}

#finalMessage.show {

    opacity: 1;

    transform:
        translate(-50%, 0);
}

.final-main {

    font-family:
        "Segoe Script",
        "Brush Script MT",
        cursive;

    font-size:
        clamp(21px, 6vw, 31px);

    line-height: 1.4;

    text-shadow:
        0 3px 15px rgba(80,20,40,.45);
}

.final-small {

    margin-top: 9px;

    font-size: 15px;

    opacity: .9;
}


/* =========================================================
   REPLAY
========================================================= */

#replay {

    position: absolute;

    right: 14px;

    bottom:
        calc(
            env(safe-area-inset-bottom)
            + 10px
        );

    padding:
        8px 13px;

    border: none;

    border-radius: 999px;

    background:
        rgba(255,255,255,.25);

    color: white;

    backdrop-filter: blur(8px);

    opacity: 0;

    pointer-events: none;

    z-index: 90;
}

#replay.show {

    opacity: 1;

    pointer-events: auto;
}


/* =========================================================
   HEART BURST
========================================================= */

.burst {

    position: absolute;

    z-index: 300;

    color: white;

    pointer-events: none;

    font-size: 18px;

    animation:
        burstAnimation
        .8s
        ease-out
        forwards;
}

@keyframes burstAnimation {

    from {
        opacity: 1;

        transform:
            translate(0,0)
            scale(.5);
    }

    to {
        opacity: 0;

        transform:
            translate(
                var(--x),
                var(--y)
            )
            scale(1.3);
    }
}


/* =========================================================
   DESKTOP
========================================================= */

@media (min-width: 700px) {

    body {
        background: #211017;
    }

    #app {
        width: 430px;

        margin: auto;

        box-shadow:
            0 0 100px rgba(0,0,0,.4);
    }
}


/* =========================================================
   SHORT PHONE SCREENS
========================================================= */

@media (max-height: 700px) {

    .envelope-container {
        transform: scale(.82);
    }

    #scene.visible
    .envelope-container {
        transform: scale(.82);
    }

    .tulips {
        height: 160px;
    }

    .tulip {
        transform: scale(.75);
    }

    .envelope-container.paper-rising
    .letter {

        transform:
            translateX(-50%)
            translateY(-95px)
            scale(.9);
    }

    .envelope-container.paper-unfold
    .letter {

        transform:
            translateX(-50%)
            translateY(-98px)
            scale(.9);
    }

}


/* =========================================================
   REDUCED MOTION
========================================================= */

@media (prefers-reduced-motion: reduce) {

    *,
    *::before,
    *::after {

        animation-duration:
            .01ms !important;

        animation-iteration-count:
            1 !important;

        transition-duration:
            .01ms !important;
    }
}

</style>
</head>


<body>

<div id="app">


    <!-- =====================================================
         BACKGROUND
    ====================================================== -->

    <div
        class="glow"
        style="left:-100px;top:5%;"
    ></div>

    <div
        class="glow"
        style="right:-100px;bottom:5%;"
    ></div>

    <div
        class="particles"
        id="particles"
    ></div>


    <!-- =====================================================
         INTRO
    ====================================================== -->

    <section id="intro">

        <div class="intro-heart">
            ♥
        </div>

        <div class="intro-title">
            I have something for you...
        </div>

        <div class="intro-subtitle">
            something straight from my heart ♡
        </div>

        <button
            class="open-button"
            id="openButton"
        >
            Open my heart ♡
        </button>

    </section>


    <!-- =====================================================
         MAIN SCENE
    ====================================================== -->

    <main id="scene">


        <!-- =================================================
             KITTY 1
        ================================================== -->

        <div class="kitty one">

            <span class="kitty-eye left"></span>

            <span class="kitty-eye right"></span>

            <span class="kitty-nose"></span>

            <span class="kitty-bow"></span>

        </div>


        <!-- =================================================
             KITTY 2
        ================================================== -->

        <div class="kitty two">

            <span class="kitty-eye left"></span>

            <span class="kitty-eye right"></span>

            <span class="kitty-nose"></span>

            <span class="kitty-bow"></span>

        </div>


        <!-- =================================================
             KITTY 3
        ================================================== -->

        <div class="kitty three">

            <span class="kitty-eye left"></span>

            <span class="kitty-eye right"></span>

            <span class="kitty-nose"></span>

            <span class="kitty-bow"></span>

        </div>


        <!-- =================================================
             ENVELOPE
        ================================================== -->

        <div
            class="envelope-container"
            id="envelopeContainer"
        >

            <div class="envelope">


                <!-- ==============================
                     PAPER
                =============================== -->

                <div class="letter">

                    <div class="letter-inner">

                        <div
                            class="letter-header"
                        >
                            To My Love ♡
                        </div>

                        <div
                            id="letterText"
                        ></div>

                    </div>

                </div>


                <!-- ==============================
                     ENVELOPE FRONT
                =============================== -->

                <div
                    class="envelope-front"
                ></div>


                <!-- ==============================
                     FLAP
                =============================== -->

                <div
                    class="flap"
                ></div>


                <!-- ==============================
                     HEART SEAL
                =============================== -->

                <button
                    class="seal"
                    id="seal"
                    aria-label="Open my love letter"
                >
                    ♥
                </button>

            </div>

        </div>


        <!-- =================================================
             TULIPS
        ================================================== -->

        <div class="tulips">


            <div class="tulip pink">

                <div class="stem"></div>

                <div class="leaf left"></div>

                <div class="leaf right"></div>

                <div class="flower">

                    <div class="petal"></div>

                    <div class="petal"></div>

                    <div class="petal"></div>

                </div>

            </div>


            <div class="tulip white">

                <div class="stem"></div>

                <div class="leaf left"></div>

                <div class="leaf right"></div>

                <div class="flower">

                    <div class="petal"></div>

                    <div class="petal"></div>

                    <div class="petal"></div>

                </div>

            </div>


            <div class="tulip red">

                <div class="stem"></div>

                <div class="leaf left"></div>

                <div class="leaf right"></div>

                <div class="flower">

                    <div class="petal"></div>

                    <div class="petal"></div>

                    <div class="petal"></div>

                </div>

            </div>


            <div class="tulip pink">

                <div class="stem"></div>

                <div class="leaf left"></div>

                <div class="leaf right"></div>

                <div class="flower">

                    <div class="petal"></div>

                    <div class="petal"></div>

                    <div class="petal"></div>

                </div>

            </div>


            <div class="tulip white">

                <div class="stem"></div>

                <div class="leaf left"></div>

                <div class="leaf right"></div>

                <div class="flower">

                    <div class="petal"></div>

                    <div class="petal"></div>

                    <div class="petal"></div>

                </div>

            </div>


        </div>


        <!-- =================================================
             FINAL MESSAGE
        ================================================== -->

        <div id="finalMessage">

            <div class="final-main">

                And if I had to choose again...
                <br>
                I'd still choose you. ♡

            </div>

            <div class="final-small">
                Forever yours ♡
            </div>

        </div>


        <button id="replay">
            ↻ Replay
        </button>


    </main>

</div>


<script>

/* =========================================================
   💗 CUSTOMIZATION
========================================================= */

const CONFIG = {

    /* Change her name here */

    herName: "My Bubu",


    /* Change the letter here */

    letter: `Baby, I really miss your presence a lot. I miss you every second that I’m not with you. I literally cannot imagine a life without you, baby. There are gonna be many ups and downs in our lives, but baby, together we will fix each of them, I promise. Baby, I swear I breathe only and only for you, my princess. I love you a lot, baby. You have made my very, very ordinary life extremely special. Please, please baby, I beg you, I need you so, so much, betu.  

  I love you, jaan. ❤️`,


    /* Change final message here */

    finalMessage:
        "And if I had to choose again...|I'd still choose you. ♡",


    /* Tulip colors */

    tulipColors: [
        "pink",
        "white",
        "red",
        "pink",
        "white"
    ]

};


/* =========================================================
   ELEMENTS
========================================================= */

const intro =
    document.getElementById(
        "intro"
    );

const openButton =
    document.getElementById(
        "openButton"
    );

const scene =
    document.getElementById(
        "scene"
    );

const envelope =
    document.getElementById(
        "envelopeContainer"
    );

const seal =
    document.getElementById(
        "seal"
    );

const letterText =
    document.getElementById(
        "letterText"
    );

const finalMessage =
    document.getElementById(
        "finalMessage"
    );

const replay =
    document.getElementById(
        "replay"
    );

const particles =
    document.getElementById(
        "particles"
    );

const tulips =
    document.querySelectorAll(
        ".tulip"
    );

const kitties =
    document.querySelectorAll(
        ".kitty"
    );


/* =========================================================
   INITIALIZE
========================================================= */

function initialize() {

    document
        .querySelector(
            ".letter-header"
        )
        .textContent =
        `To ${CONFIG.herName} ♡`;


    const final =
        CONFIG.finalMessage.split("|");


    document
        .querySelector(
            ".final-main"
        )
        .innerHTML =
        `${final[0]}<br>${final[1]}`;


    tulips.forEach(
        (tulip, index) => {

            tulip.classList.remove(
                "pink",
                "white",
                "red"
            );

            tulip.classList.add(
                CONFIG.tulipColors[index]
            );

        }
    );

}


/* =========================================================
   PARTICLES
========================================================= */

function createParticles() {

    for (
        let i = 0;
        i < 30;
        i++
    ) {

        const particle =
            document.createElement(
                "div"
            );

        particle.className =
            "particle";

        particle.style.left =
            Math.random() * 100 + "%";

        particle.style.animationDuration =
            7 +
            Math.random() * 9 +
            "s";

        particle.style.animationDelay =
            Math.random() * 8 +
            "s";

        particle.style.opacity =
            .2 +
            Math.random() * .5;

        particles.appendChild(
            particle
        );

    }

}


/* =========================================================
   HEARTS
========================================================= */

function createHearts() {

    for (
        let i = 0;
        i < 12;
        i++
    ) {

        const heart =
            document.createElement(
                "div"
            );

        heart.className =
            "floating-heart";

        heart.textContent =
            Math.random() > .5
                ? "♡"
                : "♥";

        heart.style.left =
            Math.random() * 100 + "%";

        heart.style.fontSize =
            11 +
            Math.random() * 9 +
            "px";

        heart.style.animationDuration =
            8 +
            Math.random() * 8 +
            "s";

        heart.style.animationDelay =
            Math.random() * 8 +
            "s";

        particles.appendChild(
            heart
        );

    }

}


/* =========================================================
   START
========================================================= */

let started = false;

openButton.addEventListener(
    "click",
    startExperience
);

function startExperience() {

    if (started) return;

    started = true;

    intro.classList.add(
        "hide"
    );

    setTimeout(
        () => {

            scene.classList.add(
                "visible"
            );

        },
        400
    );

}


/* =========================================================
   ENVELOPE OPEN
========================================================= */

let envelopeOpened = false;

seal.addEventListener(
    "click",
    openEnvelope
);


function openEnvelope() {

    if (envelopeOpened) return;

    envelopeOpened = true;


    /* -----------------------------------------
       HEART BURST
    ----------------------------------------- */

    createBurst(
        window.innerWidth / 2,
        window.innerHeight / 2
    );


    /* -----------------------------------------
       STEP 1
       Open flap
    ----------------------------------------- */

    envelope.classList.add(
        "flap-open"
    );


    /*
       Wait for the flap to finish opening.
    */

    setTimeout(
        beginPaperRise,
        1050
    );

}


/* =========================================================
   PAPER RISE
========================================================= */

function beginPaperRise() {

    /*
       STEP 2

       Paper starts physically sliding
       vertically out of the envelope.
    */

    envelope.classList.add(
        "paper-rising"
    );


    /*
       Wait until paper clears
       the envelope body.
    */

    setTimeout(
        beginPaperUnfold,
        850
    );

}


/* =========================================================
   PAPER UNFOLD
========================================================= */

function beginPaperUnfold() {

    /*
       STEP 3

       Paper settles toward the viewer.
    */

    envelope.classList.add(
        "paper-unfold"
    );


    /*
       Let paper settle before
       introducing decorations.
    */

    setTimeout(
        finishPaper,
        750
    );

}


/* =========================================================
   PAPER FINISH
========================================================= */

function finishPaper() {

    envelope.classList.add(
        "paper-settle"
    );


    /*
       Tulips begin growing.
    */

    setTimeout(
        showTulips,
        250
    );


    /*
       Kitty decorations appear.
    */

    setTimeout(
        showKitties,
        650
    );


    /*
       Typewriter begins only after
       the physical animation is complete.
    */

    setTimeout(
        typeWriter,
        1200
    );


    /*
       Falling petals.
    */

    setTimeout(
        createPetals,
        1300
    );

}


/* =========================================================
   TULIPS
========================================================= */

function showTulips() {

    tulips.forEach(
        (tulip, index) => {

            setTimeout(
                () => {

                    tulip.classList.add(
                        "show"
                    );

                },
                index * 130
            );

        }
    );

}


/* =========================================================
   KITTIES
========================================================= */

function showKitties() {

    kitties.forEach(
        (kitty, index) => {

            setTimeout(
                () => {

                    kitty.classList.add(
                        "show"
                    );

                },
                index * 200
            );

        }
    );

}


/* =========================================================
   TYPEWRITER
========================================================= */

let typeStarted = false;

function typeWriter() {

    if (typeStarted) return;

    typeStarted = true;

    let index = 0;

    const text =
        CONFIG.letter;


    function writeCharacter() {

        if (
            index <
            text.length
        ) {

            const character =
                text.charAt(index);

            letterText.textContent +=
                character;

            index++;


            let delay = 25;


            if (
                character === "\n"
            ) {

                delay = 220;

            }


            setTimeout(
                writeCharacter,
                delay
            );

        }
        else {

            finishLetter();

        }

    }


    writeCharacter();

}


/* =========================================================
   FINAL
========================================================= */

function finishLetter() {

    setTimeout(
        () => {

            finalMessage.classList.add(
                "show"
            );

            replay.classList.add(
                "show"
            );

        },
        1000
    );

}


/* =========================================================
   FALLING PETALS
========================================================= */

function createPetals() {

    for (
        let i = 0;
        i < 18;
        i++
    ) {

        const petal =
            document.createElement(
                "div"
            );

        petal.className =
            "petal-fall";

        petal.style.left =
            Math.random() * 100 + "%";

        petal.style.animationDuration =
            7 +
            Math.random() * 8 +
            "s";

        petal.style.animationDelay =
            Math.random() * 7 +
            "s";

        scene.appendChild(
            petal
        );

    }

}


/* =========================================================
   PARTICLE BURST
========================================================= */

function createBurst(x, y) {

    const symbols = [
        "♥",
        "♡",
        "✦",
        "✧"
    ];


    for (
        let i = 0;
        i < 18;
        i++
    ) {

        const burst =
            document.createElement(
                "div"
            );

        burst.className =
            "burst";

        burst.textContent =
            symbols[
                Math.floor(
                    Math.random() *
                    symbols.length
                )
            ];


        burst.style.left =
            x + "px";

        burst.style.top =
            y + "px";


        const angle =
            Math.random() *
            Math.PI *
            2;

        const distance =
            45 +
            Math.random() *
            100;


        burst.style.setProperty(
            "--x",
            Math.cos(angle) *
            distance +
            "px"
        );

        burst.style.setProperty(
            "--y",
            Math.sin(angle) *
            distance +
            "px"
        );


        document.body.appendChild(
            burst
        );


        setTimeout(
            () => {
                burst.remove();
            },
            900
        );

    }

}


/* =========================================================
   TULIP INTERACTION
========================================================= */

tulips.forEach(
    tulip => {

        tulip.addEventListener(
            "click",
            event => {

                event.stopPropagation();


                tulip.animate(
                    [
                        {
                            rotate: "-3deg"
                        },
                        {
                            rotate: "5deg"
                        },
                        {
                            rotate: "-4deg"
                        },
                        {
                            rotate: "2deg"
                        },
                        {
                            rotate: "0deg"
                        }
                    ],
                    {
                        duration: 650,
                        easing:
                            "ease-in-out"
                    }
                );


                createBurst(
                    event.clientX,
                    event.clientY
                );

            }
        );

    }
);


/* =========================================================
   KITTY INTERACTION
========================================================= */

kitties.forEach(
    kitty => {

        kitty.addEventListener(
            "click",
            event => {

                event.stopPropagation();


                kitty.animate(
                    [
                        {
                            transform:
                                "scale(1)"
                        },
                        {
                            transform:
                                "scale(1.15) rotate(-5deg)"
                        },
                        {
                            transform:
                                "scale(.96) rotate(4deg)"
                        },
                        {
                            transform:
                                "scale(1)"
                        }
                    ],
                    {
                        duration: 500,
                        easing:
                            "cubic-bezier(.17,.84,.44,1)"
                    }
                );


                createBurst(
                    event.clientX,
                    event.clientY
                );

            }
        );

    }
);


/* =========================================================
   REPLAY
========================================================= */

replay.addEventListener(
    "click",
    () => {

        window.location.reload();

    }
);


/* =========================================================
   INITIALIZE
========================================================= */

initialize();

createParticles();

createHearts();

</script>

</body>
</html>
